name: Deploy to GitHub Pages

# Pages is configured to serve from the gh-pages branch, so deploying
# is just syncing main -> gh-pages; GitHub's own "pages build and
# deployment" workflow picks it up from there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish main to gh-pages
        run: git push --force origin HEAD:gh-pages
