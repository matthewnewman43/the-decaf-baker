name: Deploy to GitHub Pages

# Renders template.html + site.yaml into index.html, then publishes to
# the gh-pages branch; GitHub's built-in "pages build and deployment"
# workflow picks it up from there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render site from site.yaml
        run: python3 render.py

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html
          git commit -m "Render site from site.yaml"
          git push --force origin HEAD:gh-pages
